<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Clientes</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="login">
  <h2>Iniciar sesión</h2>

  <input
    id="email"
    type="email"
    placeholder="Correo electrónico"
  >

  <input
    id="password"
    type="password"
    placeholder="Contraseña"
  >

  <button onclick="iniciarSesion()">
    Iniciar sesión
  </button>

  <p id="mensajeLogin"></p>
</div>
  <h1>Mis Clientes</h1>

  <input id="buscar" placeholder="Buscar cliente..." oninput="buscarClientes()">
<button onclick="ordenarClientes()">🔤 Ordenar A–Z</button>
  <br><br>

  <input id="nombre" placeholder="Nombre del cliente">
  <input id="telefono" placeholder="Teléfono">
<textarea id="nota" placeholder="Nota del cliente"></textarea>
  <button class="add" onclick="agregarCliente()">Añadir cliente</button>

  <p id="contador">0 clientes</p>
  <div class="resumen">

  <div class="tarjeta-resumen">
    <span>👥</span>
    <strong id="totalResumen">0</strong>
    <small>Total clientes</small>
  </div>

  <div class="tarjeta-resumen">
    <span>📱</span>
    <strong id="telefonosResumen">0</strong>
    <small>Con teléfono</small>
  </div>

</div>
<button onclick="hacerCopia()">💾 Guardar copia</button>

<label>
  📂 Restaurar copia
  <input type="file" accept=".json" onchange="importarCopia(event)">
</label>
  <ul id="lista"></ul>

  <script src="script.js"></script>

</body>
</html
async function iniciarSesion() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const mensaje = document.getElementById("mensajeLogin");

  if (!supabaseClient) {
    mensaje.textContent = "Conectando con Supabase...";
    return;
  }

  if (!email || !password) {
    mensaje.textContent = "Completa el correo y la contraseña.";
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    mensaje.textContent = "Correo o contraseña incorrectos.";
    return;
  }

  mensaje.textContent = "¡Inicio de sesión correcto!";

  document.getElementById("login").style.display = "none";
}
